# CI 自动化流水线
# 触发条件：push 到 main 或 PR 到 main
# 阶段：Build（编译门禁）→ Lint / Unit-Test / Integration-Test（三 job 并行）

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "resources/**"
      - ".codebuddy/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "resources/**"
      - ".codebuddy/**"

# 同一分支的并发运行只保留最新的，取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────── Build（编译门禁）────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # 前端产物经 go:embed 进二进制；不构建则 dist 只剩占位 index.html（二进制里的前端是空壳）。
      # 对齐 Python：根 package.json 的 `npm run build` = cd channels/web/frontend && npm run build
      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: internal/swarm/channels/web/frontend/package-lock.json

      - name: 构建前端
        working-directory: internal/swarm/channels/web/frontend
        timeout-minutes: 15
        run: |
          # --prefer-offline：registry 抖动时优先用本地缓存，减少整条流水线因 npm 变红
          npm ci --prefer-offline
          npm run build

      # 前端产物经 go:embed 编译进二进制。其余 3 个 job 直接 go build/go test，
      # 没有这份产物时编译进去的是 dist 里的占位 index.html——任何"断言首页内容"
      # 的用例在这三个 job 里都会看到占位文案。这里把产物做成 artifact 供其复用。
      - name: 上传前端产物
        uses: actions/upload-artifact@v7
        with:
          name: web-frontend-dist
          path: internal/swarm/channels/web/frontend/dist
          if-no-files-found: error
          retention-days: 3

      - name: 验证编译
        run: |
          echo "验证编译..."
          go build -mod=mod ./...
          echo "编译通过"

      # Web WS 契约矩阵：上游可达时重生成并与入库版本比对，防止矩阵过期。
      # 上游不可达时跳过（不因外部网络问题判红）；-verify 缺口门禁在 27-A B1
      # 收尾后才转强制。
      - name: 校验 Web RPC 契约矩阵
        run: |
          if git clone --depth 1 https://gitcode.com/openJiuwen/jiuwenswarm.git /tmp/upstream; then
            go run ./cmd/rpc-matrix -upstream /tmp/upstream
            if ! git diff --exit-code -- docs/sync/web-rpc-matrix.md docs/sync/web-rpc-downstream-gaps.md; then
              echo "矩阵已过期：请本地重跑 go run ./cmd/rpc-matrix 并提交 docs/sync/ 下两份文档"
              exit 1
            fi
          else
            echo "上游不可达，跳过矩阵漂移校验"
          fi

  # ──────────────────────────── Lint ────────────────────────────

  lint:
    name: Lint
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          # 固定补丁版，与 golangci-lint v2.12.2 二进制的构建版本（go1.26.9）对齐。
          # 用浮动 "1.26" 时 runner 一旦升到 go1.26.10，staticcheck 读不到新版导出数据，
          # 丢失「t.Fatal 不返回」的事实，会把仓库里 168 个 _test.go、470 处
          # `if x == nil { t.Fatal(...) }` 全判成 SA5011 误报（2026-11-03 实测：
          # 本地用同版本 lint 跑同一份代码 0 命中）。升级 lint 版本后可同步放开此固定。
          go-version: "1.26.9"
          cache: true

      - name: 下载前端产物
        uses: actions/download-artifact@v5
        with:
          name: web-frontend-dist
          path: internal/swarm/channels/web/frontend/dist
        continue-on-error: true

      - name: 验证代码格式 (gofmt)
        run: |
          output=$(gofmt -l .)
          # 过滤掉 vendor 目录
          output=$(echo "$output" | grep -v '^vendor/' || true)
          if [ -n "$output" ]; then
            echo "::error::以下文件格式不符合 gofmt："
            echo "$output"
            # 输出差异详情
            for f in $output; do
              echo "::group::差异: $f"
              gofmt -d "$f"
              echo "::endgroup::"
            done
            exit 1
          fi
          echo "所有文件格式符合 gofmt"

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          # 10m：Lint 作业固定 go1.26.9 后，首次运行需要为新工具链重建构建缓存
          # （setup-go 的 cache key 含 go.sum + 版本），冷缓存实测 5m 会超时
          # （golangci-lint exit code 4）。缓存热后单次约 1~2 分钟。
          args: --modules-download-mode=mod --timeout=10m

  # ──────────────────────────── Unit Test ────────────────────────────

  unit-test:
    name: Unit Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6
        with:
          # 修改文件覆盖率门禁需要父提交作为对比基准：默认浅克隆（depth=1）下 HEAD~1 不存在，
          # 门禁曾因此静默跳过。depth=2 保证 HEAD~1 可用。
          fetch-depth: 2

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: 下载前端产物
        uses: actions/download-artifact@v5
        with:
          name: web-frontend-dist
          path: internal/swarm/channels/web/frontend/dist
        continue-on-error: true

      - name: 恢复覆盖率基线缓存
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-pr-${{ github.sha }}
          restore-keys: |
            coverage-baseline-main-
        continue-on-error: true

      - name: 运行单元测试（带覆盖率）
        env:
          # mattn/go-sqlite3 为 CGO 驱动，FTS5 扩展需 sqlite_fts5 构建标签启用
          CGO_ENABLED: 1
        run: go test -mod=mod -tags "sqlite_fts5 test" -race -coverprofile=coverage.out ./...

      - name: 检查覆盖率阈值（≥ 72.0%）
        run: |
          COVERAGE=$(GOFLAGS=-mod=mod go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "总覆盖率: ${COVERAGE}%"
          PASS=$(echo "$COVERAGE >= 72.0" | bc -l)
          if [ "$PASS" != "1" ]; then
            echo "::error::覆盖率 ${COVERAGE}% 低于阈值 72.0%"
            exit 1
          fi
          echo "覆盖率达标"

      - name: 检查修改文件「改动行」覆盖率（≥ 85%）
        run: |
          # 基准解析：push 用事件 before，PR 用 base 分支 merge-base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.base_ref }}"
            git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/pr-base" >/dev/null 2>&1 || true
            BASE_REF=$(git merge-base origin/pr-base HEAD 2>/dev/null || true)
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF=""
            elif ! git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
              echo "::warning::无法拉取基准提交 ${BASE_REF}，回退 HEAD~1（多提交首次 push 时只检查最后一个提交的改动）"
              BASE_REF=""
            fi
          fi

          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git rev-parse --verify HEAD~1 2>/dev/null || true)
          fi
          if [ -z "$BASE_REF" ]; then
            echo "::error::无法确定对比基准（事件 ${{ github.event_name }}，git 历史不足），改动行覆盖率检查无法执行"
            exit 1
          fi
          echo "对比基准: ${BASE_REF}"

          # 改动行单测覆盖率阈值 85%：新增/修改的行必须有单测覆盖，
          # 整文件口径只作参考列（巨型文件的整文件覆盖率长期被豁免，会掩盖新改动）。
          bash scripts/check-changed-line-coverage.sh \
            coverage.out "$BASE_REF" 85 .coverage-exempt

      - name: 覆盖率回归检查
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f coverage-baseline.txt ]; then
            echo "::warning::未找到 main 分支覆盖率基线（首次运行或缓存已过期），跳过回归检查"
            exit 0
          fi

          BASELINE=$(cat coverage-baseline.txt)
          CURRENT=$(GOFLAGS=-mod=mod go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          DIFF=$(echo "scale=1; $BASELINE - $CURRENT" | bc)

          echo "覆盖率回归检查："
          echo "  - main 基线覆盖率: ${BASELINE}%"
          echo "  - 当前 PR 覆盖率:  ${CURRENT}%"
          echo "  - 差值: ${DIFF}%"

          if [ "$(echo "$DIFF > 1.5" | bc -l)" = "1" ]; then
            echo "::error::覆盖率回归超过 1.5%（基线 ${BASELINE}% → 当前 ${CURRENT}%，下降 ${DIFF}%），请补充单元测试"
            exit 1
          elif [ "$(echo "$DIFF > 0" | bc -l)" = "1" ]; then
            echo "::warning::覆盖率有所下降（基线 ${BASELINE}% → 当前 ${CURRENT}%，下降 ${DIFF}%），建议补充单元测试"
          else
            echo "覆盖率未下降"
          fi

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

      - name: 保存覆盖率基线
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(GOFLAGS=-mod=mod go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "$COVERAGE" > coverage-baseline.txt
          echo "已保存覆盖率基线: ${COVERAGE}%"

      - name: 写入覆盖率基线缓存
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: coverage-baseline.txt
          key: coverage-baseline-main-${{ github.sha }}

  # ──────────────────────────── Integration Test ────────────────────────────

  integration-test:
    name: Integration Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6
        with:
          # 同 unit-test：修改文件集成测试覆盖率门禁需要父提交作为对比基准
          fetch-depth: 2

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: 下载前端产物
        uses: actions/download-artifact@v5
        with:
          name: web-frontend-dist
          path: internal/swarm/channels/web/frontend/dist
        continue-on-error: true

      - name: 验证集成测试合规性（AST 调用分析 + 断言密度）
        run: |
          echo "运行 integration-audit 静态审计..."
          # 第一层：AST CallExpr 调用跨度 + 有效测试密度（击杀符号引用凑数与空壳目录）
          # -verify 交给后续"覆盖交叉验证"步骤统一执行（复用已构建的测试二进制缓存）
          # -defer-span：调用跨度 <3 的目录不在此判罚，标记 PendingCoverage，
          # 由后续"覆盖交叉验证"步骤逐目录 go test 以真实覆盖裁决
          go run ./cmd/integration-audit \
            -min-call-span 3 \
            -min-assertions 2 \
            -min-effective-tests 1 \
            -defer-span \
            -json > integration-audit-report.json
          AUDIT_EXIT=$?
          # 静态层不通过（含空壳目录、缺 build tag 等硬违规）直接失败
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            cat integration-audit-report.json
            echo "::error::集成测试静态审计未通过（详见上方 JSON 报告），处置指引："
            echo "  1. 符号引用凑数（调用跨度不足）→ 补真实跨子系统调用断言，或迁回 internal 包单元测试"
            echo "  2. 空壳目录（有效测试不足）→ 补充真实测试或删除"
            echo "  3. 确属集成性质但跨度不足 → 在 .integration-scope-exempt 登记并注明理由"
            exit 1
          fi
          echo "静态审计通过（调用跨度或已登记豁免的目录合规）"

      - name: 运行集成测试（带覆盖率）
        env:
          CGO_ENABLED: 1
          # GitHub 远程技能集成测试（对齐 Python RUN_GITHUB_TEST=1 守卫）
          RUN_GITHUB_TEST: "1"
          # 内置令牌：匿名 60 次/小时 → 认证 5000 次/小时，避免限流误红
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 读本次提交的 tree，保证 fixture 与代码同版本
          GITHUB_SKILL_TEST_REF: ${{ github.sha }}
        run: |
          # 收集集成测试直接 import 的 internal 包，作为覆盖率追踪目标
          COVER_PKGS=$(grep -rh '"github.com/uapclaw/uapclaw-go/internal/' tests/integration/ --include='*.go' \
            | sed 's|.*"\(github.com/uapclaw/uapclaw-go/internal/[^"]*\)".*|\1|' \
            | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "覆盖率追踪包: ${COVER_PKGS}"

          go test -mod=mod -tags "sqlite_fts5 test integration" \
            -coverprofile=integration_coverage.out \
            -coverpkg="${COVER_PKGS}" \
            ./tests/integration/...

      - name: 覆盖交叉验证（灰区目录 → 子系统真实覆盖门禁）
        env:
          CGO_ENABLED: 1
        run: |
          # 第二层：对静态审计标记的灰区目录（PendingCoverage）逐目录运行 go test，
          # 按 internal 二级子系统聚合覆盖行数，要求 ≥3 个子系统各 ≥30 行。
          # 共享 suite 基类 SetupTest 带来的基线污染 ≤24 行，低于 30 行门槛。
          # -verify 隐含 -defer-span：内部重跑静态审计（快速）标记灰区目录后逐目录验证。
          go run ./cmd/integration-audit \
            -min-call-span 3 \
            -verify \
            -verify-workdir /tmp/verify-profiles

      - name: 检查集成测试总覆盖率（≥ 15.0%）
        run: |
          COVERAGE=$(GOFLAGS=-mod=mod go tool cover -func=integration_coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "集成测试总覆盖率: ${COVERAGE}%"
          PASS=$(echo "$COVERAGE >= 15.0" | bc -l)
          if [ "$PASS" != "1" ]; then
            echo "::error::集成测试覆盖率 ${COVERAGE}% 低于阈值 15.0%"
            exit 1
          fi
          echo "集成测试覆盖率达标"

      - name: 检查修改文件「改动行」集成测试覆盖率（≥ 5%）
        run: |
          # 基准解析：push 用事件 before，PR 用 base 分支 merge-base
          #（浅克隆下 merge-base 需祖先链，故 PR 场景显式拉取 base 分支）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_BRANCH="${{ github.base_ref }}"
            git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/pr-base" >/dev/null 2>&1 || true
            BASE_REF=$(git merge-base origin/pr-base HEAD 2>/dev/null || true)
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF=""
            elif ! git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
              echo "::warning::无法拉取基准提交 ${BASE_REF}，回退 HEAD~1（多提交首次 push 时只检查最后一个提交的改动）"
              BASE_REF=""
            fi
          fi

          # 分支首次 push / force push 后 before 为全 0 → 回退 HEAD~1。
          # 已知盲区：一次 push 多个提交时只覆盖最后一个提交的改动（上一行 warning 会留痕）。
          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git rev-parse --verify HEAD~1 2>/dev/null || true)
          fi
          if [ -z "$BASE_REF" ]; then
            echo "::error::无法确定对比基准（事件 ${{ github.event_name }}，git 历史不足），改动行覆盖率检查无法执行"
            exit 1
          fi
          echo "对比基准: ${BASE_REF}"

          # 改动行集成覆盖率阈值 5%：本仓库集成套件尚未覆盖 agent_teams / pregel 等内部子系统，
          # 先以低位门禁保证"改动行至少被集成链路执行过"，逐轮抬高。
          bash scripts/check-changed-line-coverage.sh \
            integration_coverage.out "$BASE_REF" 5 .integration-coverage-exempt

      - name: 上传集成测试覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-report
          path: integration_coverage.out

      - name: 保存集成测试覆盖率基线
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(GOFLAGS=-mod=mod go tool cover -func=integration_coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "$COVERAGE" > integration-coverage-baseline.txt
          echo "已保存集成测试覆盖率基线: ${COVERAGE}%"

      - name: 写入集成测试覆盖率基线缓存
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: integration-coverage-baseline.txt
          key: integration-coverage-baseline-main-${{ github.sha }}
